services:
  - type: web
    name: rede-lumo-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LIBREOFFICE_PATH
        value: /usr/bin/soffice
      - key: PDF_TIMEOUT
        value: "90"
    disk:
      name: storage
      mountPath: /app/storage
      sizeGB: 1
